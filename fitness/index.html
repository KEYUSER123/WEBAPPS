<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FORM / FITNESS</title>
<style>
:root{--bg:#f5f3eb;--panel:#fffef9;--ink:#24332e;--muted:#6d7a73;--line:#e3e5dc;--green:#668b72;--green2:#dce9dc;--blue:#dce8f2;--accent:#d8e7d7;--danger:#b85454;--shadow:0 8px 24px #25362a0d}
[data-theme=dark]{--bg:#17211d;--panel:#222f29;--ink:#edf3ed;--muted:#aebbb2;--line:#39483f;--green:#91b99b;--green2:#31483a;--blue:#2b4050;--accent:#304638;--danger:#f18b8b;--shadow:0 8px 24px #0003}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:var(--green);color:#fff;font-weight:650}button.secondary{background:var(--green2);color:var(--ink)}button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}button.danger{background:var(--danger)}input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--ink)}label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:0 0 5px}h1,h2,h3,p{margin-top:0}h1{font-size:25px;margin-bottom:3px}h2{font-size:18px;margin-bottom:12px}h3{font-size:15px;margin-bottom:8px}.muted{color:var(--muted)}.small{font-size:12px}.app{max-width:1180px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.brand{display:flex;gap:12px;align-items:center}.logo{width:42px;height:42px;border-radius:14px;background:var(--green2);display:grid;place-items:center;font-weight:900;letter-spacing:-1px}.layout{display:grid;grid-template-columns:220px 1fr;gap:20px}.nav{display:flex;flex-direction:column;gap:7px;align-self:start;position:sticky;top:16px}.nav button{text-align:left;background:transparent;color:var(--muted);font-weight:650}.nav button.active,.nav button:hover{background:var(--green2);color:var(--ink)}.content{min-width:0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.metric{background:var(--accent);border-radius:15px;padding:15px}.metric .num{font-size:25px;font-weight:800}.row{display:flex;gap:9px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.stack{display:flex;flex-direction:column;gap:10px}.field{min-width:0}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.full{grid-column:1/-1}.item{border:1px solid var(--line);border-radius:13px;padding:12px;display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:8px}.itemmain{min-width:0}.itemtitle{font-weight:750}.pill{display:inline-block;border-radius:99px;padding:4px 9px;background:var(--blue);font-size:11px;font-weight:750}.empty{border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.hidden{display:none!important}.photo{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}.photoGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.photoCard{border:1px solid var(--line);padding:7px;border-radius:14px}.photoCard button{width:100%;margin-top:6px}.note{font-size:12px;color:var(--muted);margin-top:10px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:11px 16px;border-radius:12px;display:none;z-index:10}.weekday{display:flex;gap:7px;flex-wrap:wrap}.weekday label{display:flex;gap:5px;align-items:center;border:1px solid var(--line);padding:8px 10px;border-radius:10px;margin:0}.weekday input{width:auto}.topactions{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:760px){.app{padding:14px}.layout{grid-template-columns:1fr}.nav{position:static;display:grid;grid-template-columns:repeat(3,1fr)}.nav button{text-align:center;padding:9px 5px;font-size:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.photoGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.top{align-items:flex-start}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}
.app{padding-top:calc(22px + env(safe-area-inset-top,0px));padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
</style>
</head>
<body><div class="app" id="app">
<header class="top"><div class="brand"><div class="logo">F/F</div><div><h1>FORM / FITNESS</h1><div class="muted small">Dein Training. Dein Fortschritt.</div></div></div><div class="topactions"><button class="ghost" id="themeBtn">☾ Modus</button><button class="secondary" id="exportBtn">Backup exportieren</button><button class="ghost" id="importBtn">Import</button><input id="importFile" type="file" accept="application/json" class="hidden"></div></header>
<div class="layout"><nav class="nav" id="nav"></nav><main class="content" id="view"></main></div></div><div class="toast" id="toast"></div>
<script>
window.addEventListener('error',e=>{const v=document.querySelector('#view');if(v&&!v.innerHTML.trim())showFatal(e.error||e.message)});
function showFatal(e){console.error(e);const v=document.querySelector('#view');if(!v)return;v.innerHTML='<div class="panel"><h2>Anzeigefehler</h2><p class="muted">'+esc(e&&e.message||e)+'</p><p class="muted">Deine Daten sind nicht verloren. Du kannst sie sichern oder zurücksetzen.</p><div class="row wrap"><button id="fxExp">Daten als Backup exportieren</button><button class="danger" id="fxReset">Gespeicherte Daten zurücksetzen</button></div></div>';
document.querySelector('#fxExp').onclick=()=>document.querySelector('#exportBtn').click();
const r=document.querySelector('#fxReset');r.onclick=()=>{if(r.dataset.arm!=='1'){r.dataset.arm='1';r.textContent='Sicher? Löscht alles';return}try{localStorage.removeItem(KEY)}catch(x){}db=fresh();render()}}
const KEY='formFitnessIntegratedV1';
const fresh=()=>({theme:(window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'),exercises:[],workouts:[],plans:[],activePlan:null,history:[],prs:[],measurements:[],foods:[],photos:[],locations:[]});
let db=load(), page='dashboard';
function normalize(d){const o={...fresh(),...(d&&typeof d==='object'&&!Array.isArray(d)?d:{})};
for(const k of ['exercises','workouts','plans','history','prs','measurements','foods','photos','locations'])o[k]=(Array.isArray(o[k])?o[k]:[]).filter(x=>x&&typeof x==='object').map(x=>({...x,id:x.id||id()}));
o.workouts.forEach(w=>{if(!Array.isArray(w.exerciseIds))w.exerciseIds=[]});o.history.forEach(h=>{if(!Array.isArray(h.exerciseIds))h.exerciseIds=[];if(!h.sets||typeof h.sets!=='object'||Array.isArray(h.sets))h.sets={}});o.plans.forEach(p=>{if(!p.schedule||typeof p.schedule!=='object')p.schedule={}});
o.theme=o.theme==='dark'?'dark':'light';return o}
function load(){try{return normalize(JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return fresh()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){/* Manche Vorschau-Umgebungen sperren localStorage. */}document.documentElement.dataset.theme=db.theme==='dark'?'dark':'light'}
function id(){return Math.random().toString(36).slice(2,10)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){let t=document.querySelector('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function dateStr(d=new Date()){return d.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
const navItems=[['dashboard','⌂','Übersicht'],['exercises','＋','Übungen'],['workouts','▤','Workout-Vorlagen'],['plans','▦','Trainingspläne'],['history','◷','Trainingshistorie'],['prs','↗','Bestleistungen'],['measurements','◎','Messwerte'],['photos','▧','Fortschrittsfotos'],['nutrition','◉','Ernährung'],['locations','⌖','Trainingsorte']];
function render(){try{renderMain()}catch(e){showFatal(e)}}
function renderMain(){document.querySelector('#nav').innerHTML=navItems.map(([k,i,n])=>`<button class="${page===k?'active':''}" data-page="${k}">${i} &nbsp;${n}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});let v=document.querySelector('#view');v.innerHTML=views[page]();wireCommon(v);save()}
function activePlan(){return db.plans.find(p=>p.id===db.activePlan)}
function exerciseName(eid){return db.exercises.find(e=>e.id===eid)?.name||'Gelöschte Übung'}
function workoutName(wid){return db.workouts.find(w=>w.id===wid)?.name||'Workout'}
function empty(msg){return `<div class="empty">${msg}</div>`}
function item(title,sub,actions=''){return `<div class="item"><div class="itemmain"><div class="itemtitle">${title}</div><div class="muted small">${sub||''}</div></div><div class="row wrap">${actions}</div></div>`}
function delBtn(type,idv){return `<button class="ghost" data-del="${type}" data-id="${idv}">Löschen</button>`}
function viewsDummy(){}
const views={
dashboard:()=>{let p=activePlan(),day=new Date().getDay(),slot=p?.schedule?.[day],w=slot?db.workouts.find(x=>x.id===slot):null;return `<div class="panel"><div class="muted">${dateStr()}</div><h1 style="margin:8px 0 16px">Dein Fortschritt beginnt heute.</h1><div class="grid"><div class="metric"><div class="muted small">Trainings absolviert</div><div class="num">${db.history.length}</div></div><div class="metric"><div class="muted small">Gespeicherte Übungen</div><div class="num">${db.exercises.length}</div></div><div class="metric"><div class="muted small">Aktiver Trainingsplan</div><div class="num" style="font-size:17px">${esc(p?.name||'Keiner')}</div></div></div></div><div class="panel"><div class="sectionhead"><h2>Heutiges Training</h2><span class="pill">${p?'Aktiver Plan':'Kein Plan aktiv'}</span></div>${w?`<h3>${esc(w.name)}</h3><p class="muted">${w.exerciseIds.map(exerciseName).map(esc).join(' · ')||'Noch keine Übungen zugewiesen'}</p><button data-start="${w.id}">Training eintragen</button>`:empty(p?'Für heute ist kein Workout eingeplant.':'Lege einen Trainingsplan an und aktiviere ihn, damit dein Wochenplan hier erscheint.')}<p class="note">Trainingsplan wechseln: Bereich „Trainingspläne“ öffnen und „Aktivieren“ wählen.</p></div><div class="panel"><h2>Letzte Einheiten</h2>${histSorted().slice(0,3).map(h=>item(esc(h.name),`${esc(h.date)} · ${h.exerciseIds.length} Übungen`, `<button class="ghost" data-openhistory="${h.id}">Ansehen</button>`)).join('')||empty('Deine abgeschlossenen Trainings erscheinen hier.')}</div>`},
exercises:()=>`<div class="panel"><h2>Übungsbibliothek</h2><p class="muted">Lege Übungen zuerst hier an. Workout-Vorlagen verwenden anschließend genau diese gespeicherten Übungen.</p><form id="exerciseForm" class="formgrid"><div class="field"><label>Übungsname</label><input name="name" required placeholder="z. B. Kniebeugen"></div><div class="field"><label>Muskelgruppe</label><select name="group"><option>Beine</option><option>Brust</option><option>Rücken</option><option>Schultern</option><option>Arme</option><option>Core</option><option>Ganzkörper</option><option>Cardio</option><option>Sonstiges</option></select></div><div class="field"><label>Gerät (optional)</label><input name="equipment" placeholder="z. B. Langhantel"></div><div class="field"><label>Notiz (optional)</label><input name="note" placeholder="Technikhinweis"></div><div class="full"><button>Übung speichern</button></div></form></div><div class="panel"><div class="sectionhead"><h2>Gespeicherte Übungen</h2><span class="pill">${db.exercises.length}</span></div>${db.exercises.map(e=>item(esc(e.name),`${esc(e.group)}${e.equipment?' · '+esc(e.equipment):''}${e.note?' · '+esc(e.note):''}`,delBtn('exercise',e.id))).join('')||empty('Noch keine Übungen. Füge oben deine erste Übung hinzu.')}</div>`,
workouts:()=>`<div class="panel"><h2>Workout-Vorlage erstellen</h2><form id="workoutForm" class="formgrid"><div class="field"><label>Name</label><input name="name" required placeholder="z. B. Oberkörper A"></div><div class="field"><label>Notiz (optional)</label><input name="note" placeholder="Schwerpunkt"></div><div class="field full"><label>Übungen auswählen (Mehrfachauswahl möglich)</label><select name="exerciseIds" multiple size="6" style="min-height:140px">${db.exercises.map(e=>`<option value="${e.id}">${esc(e.name)} — ${esc(e.group)}</option>`).join('')}</select><div class="note">Halte auf dem iPad mehrere Optionen gedrückt bzw. nutze die Mehrfachauswahl. Es werden keine zufälligen Übungen hinzugefügt.</div></div><div class="full"><button ${db.exercises.length?'':'disabled'}>Vorlage speichern</button></div></form></div><div class="panel"><h2>Gespeicherte Vorlagen</h2>${db.workouts.map(w=>item(esc(w.name),`${w.exerciseIds.length} Übungen: ${w.exerciseIds.map(exerciseName).map(esc).join(', ')||'keine'}${w.note?' · '+esc(w.note):''}`,`<button class="secondary" data-editworkout="${w.id}">Bearbeiten</button>${delBtn('workout',w.id)}`)).join('')||empty('Erstelle Übungen und stelle daraus deine Workout-Vorlagen zusammen.')}</div>`,
plans:()=>`<div class="panel"><h2>Trainingsplan erstellen</h2><form id="planForm" class="stack"><div class="formgrid"><div class="field"><label>Planname</label><input name="name" required placeholder="z. B. 3-Tage-Plan"></div><div class="field"><label>Beschreibung (optional)</label><input name="note" placeholder="Trainingsziel"></div></div><label>Workout pro Wochentag zuweisen</label><div class="stack">${[['Montag',1],['Dienstag',2],['Mittwoch',3],['Donnerstag',4],['Freitag',5],['Samstag',6],['Sonntag',0]].map(([d,n])=>`<div class="row"><div style="width:110px">${d}</div><select name="day${n}"><option value="">Ruhetag</option>${db.workouts.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select></div>`).join('')}</div><button ${db.workouts.length?'':'disabled'}>Trainingsplan speichern</button></form></div><div class="panel"><div class="sectionhead"><h2>Deine Trainingspläne</h2><span class="pill">${db.plans.length} Pläne</span></div>${db.plans.map(p=>item(esc(p.name),`${p.id===db.activePlan?'● Aktiv · ':''}${esc(p.note||'')}`,`${p.id!==db.activePlan?`<button data-activate="${p.id}">Aktivieren</button>`:'<span class="pill">Aktiv</span>'}<button class="secondary" data-editplan="${p.id}">Bearbeiten</button>${delBtn('plan',p.id)}`)+`<div class="muted small" style="margin:5px 0 12px 12px">${['So','Mo','Di','Mi','Do','Fr','Sa'].map((d,i)=>`${d}: ${p.schedule?.[i]?esc(workoutName(p.schedule[i])):'Ruhetag'}`).join(' · ')}</div>`).join('')||empty('Erstelle einen Plan und aktiviere ihn. Nur der aktive Plan steuert das Dashboard.')}<p class="note">Der Wechsel des aktiven Plans löscht keine Trainingshistorie.</p></div>`,
history:()=>`<div class="panel"><h2>Trainingshistorie</h2><p class="muted">Abgeschlossene Einheiten bleiben erhalten, auch wenn du den aktiven Plan wechselst. Über „Bearbeiten“ trägst du Gewicht und Wiederholungen pro Satz ein.</p><div class="row wrap" style="margin-bottom:12px"><select id="nhw" style="flex:2;min-width:160px"><option value="">Freies Training</option>${db.workouts.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select><input type="date" id="nhd" value="${todayIso()}" style="flex:1;min-width:140px"><button id="newHist">+ Training nachtragen</button></div>${histSorted().map(h=>item(esc(h.name),`${esc(h.date)}<br>${h.exerciseIds.map(x=>esc(exerciseName(x))+(setTxt(h,x)?' – '+esc(setTxt(h,x)):'')).join('<br>')}`,`<button class="secondary" data-edit-history="${h.id}">Bearbeiten</button>${delBtn('history',h.id)}`)).join('')||empty('Noch keine abgeschlossenen Trainings.')}</div>`,
prs:()=>`<div class="panel"><h2>Bestleistung eintragen</h2><form id="prForm" class="formgrid"><div class="field"><label>Übung</label><select name="exerciseId" required>${db.exercises.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></div><div class="field"><label>Datum</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>Gewicht (kg)</label><input name="weight" type="number" min="0" step=".25" placeholder="z. B. 80"></div><div class="field"><label>Wiederholungen</label><input name="reps" type="number" min="0" placeholder="z. B. 5"></div><div class="field full"><label>Notiz</label><input name="note" placeholder="z. B. persönliche Bestleistung"></div><div class="full"><button ${db.exercises.length?'':'disabled'}>Eintrag speichern</button></div></form></div><div class="panel"><h2>Bestleistungs-Notizbücher</h2><div class="grid">${db.exercises.map(e=>`<div class="metric"><h3>${esc(e.name)}</h3>${db.prs.filter(p=>p.exerciseId===e.id).sort((a,b)=>Number(b.weight||0)-Number(a.weight||0)).map(p=>`<div style="margin:8px 0"><b>${p.weight||'–'} kg</b> × ${p.reps||'–'} · <span class="small">${esc(p.date)}</span><div class="small muted">${esc(p.note||'')}</div><button class="ghost" data-del="pr" data-id="${p.id}">Eintrag löschen</button></div>`).join('')||'<div class="small muted">Noch keine Einträge</div>'}</div>`).join('')||empty('Lege erst Übungen an, um Bestleistungen zu verknüpfen.')}</div></div>`,
measurements:()=>`<div class="panel"><h2>Körpermesswerte</h2><form id="measureForm" class="formgrid"><div class="field"><label>Datum</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>Körpergewicht (kg)</label><input name="weight" type="number" step=".1" min="0"></div><div class="field"><label>Körperfett (%)</label><input name="fat" type="number" step=".1" min="0" max="100"></div><div class="field"><label>Brustumfang (cm)</label><input name="chest" type="number" step=".1" min="0"></div><div class="field"><label>Taille (cm)</label><input name="waist" type="number" step=".1" min="0"></div><div class="field"><label>Hüfte (cm)</label><input name="hip" type="number" step=".1" min="0"></div><div class="full"><button>Messwerte speichern</button></div></form></div><div class="panel"><h2>Verlauf</h2>${db.measurements.slice().reverse().map(m=>item(esc(m.date),`Gewicht ${m.weight||'–'} kg · Fett ${m.fat||'–'} % · Brust ${m.chest||'–'} cm · Taille ${m.waist||'–'} cm · Hüfte ${m.hip||'–'} cm`,delBtn('measurement',m.id))).join('')||empty('Deine Messwerte erscheinen hier chronologisch.')}</div>`,
photos:()=>`<div class="panel"><h2>Fortschrittsfoto hinzufügen</h2><form id="photoForm" class="stack"><div class="field"><label>Foto (Kamera oder Fotomediathek)</label><input name="image" type="file" accept="image/*" capture="environment" required></div><div class="field"><label>Datum</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>Notiz (optional)</label><input name="note" placeholder="z. B. Frontansicht"></div><button>Foto speichern</button></form><p class="note">Fotos werden lokal in diesem Browser gespeichert. Große Bilddateien können den verfügbaren Speicherplatz überschreiten.</p></div><div class="panel"><h2>Deine Fotos</h2><div class="photoGrid">${db.photos.map(p=>`<div class="photoCard"><img class="photo" src="${p.data}" alt="Fortschrittsfoto"><div class="small" style="margin-top:5px">${esc(p.date)}</div><div class="small muted">${esc(p.note||'')}</div><button class="danger" data-del="photo" data-id="${p.id}">Löschen</button></div>`).join('')||empty('Noch keine Fortschrittsfotos gespeichert.')}</div></div>`,
nutrition:()=>`<div class="panel"><h2>Lebensmittel eintragen</h2><form id="foodForm" class="formgrid"><div class="field full"><label>Lebensmittel</label><input name="name" required placeholder="z. B. Haferflocken"></div><div class="field"><label>Portion (g)</label><input name="portion" type="number" min="0" step="1" value="100" required></div><div class="field"><label>Kalorien pro 100 g</label><input name="kcal" type="number" min="0" step=".1" required></div><div class="field"><label>Protein pro 100 g</label><input name="protein" type="number" min="0" step=".1" value="0"></div><div class="field"><label>Kohlenhydrate pro 100 g</label><input name="carbs" type="number" min="0" step=".1" value="0"></div><div class="field"><label>Fett pro 100 g</label><input name="fat" type="number" min="0" step=".1" value="0"></div><div class="field"><label>Barcode (optional)</label><input name="barcode" inputmode="numeric" placeholder="EAN"></div><div class="full row wrap"><button>Lebensmittel hinzufügen</button></div></form><p class="note">Lebensmittel werden manuell eingetragen (Online-Suche ist in dieser Umgebung nicht verfügbar).</p></div><div class="panel"><div class="sectionhead"><h2>Ernährungsprotokoll</h2><span class="pill">${db.foods.reduce((s,f)=>s+Number(f.kcal||0)*Number(f.portion||0)/100,0).toFixed(0)} kcal gesamt</span></div><div class="grid"><div class="metric"><div class="muted small">Protein</div><div class="num">${db.foods.reduce((s,f)=>s+Number(f.protein||0)*Number(f.portion||0)/100,0).toFixed(1)} g</div></div><div class="metric"><div class="muted small">Kohlenhydrate</div><div class="num">${db.foods.reduce((s,f)=>s+Number(f.carbs||0)*Number(f.portion||0)/100,0).toFixed(1)} g</div></div><div class="metric"><div class="muted small">Fett</div><div class="num">${db.foods.reduce((s,f)=>s+Number(f.fat||0)*Number(f.portion||0)/100,0).toFixed(1)} g</div></div></div>${db.foods.map(f=>item(esc(f.name),`${f.portion} g · ${(Number(f.kcal)*Number(f.portion)/100).toFixed(0)} kcal · P ${(Number(f.protein||0)*Number(f.portion)/100).toFixed(1)} g · KH ${(Number(f.carbs||0)*Number(f.portion)/100).toFixed(1)} g · F ${(Number(f.fat||0)*Number(f.portion)/100).toFixed(1)} g ${f.barcode?'· EAN '+esc(f.barcode):''}`,delBtn('food',f.id))).join('')||empty('Füge Lebensmittel manuell hinzu oder suche online.')}</div>`,
locations:()=>`<div class="panel"><h2>Trainingsorte</h2><form id="locationForm" class="formgrid"><div class="field"><label>Name</label><input name="name" required placeholder="z. B. Fitnessstudio"></div><div class="field"><label>Adresse (optional)</label><input name="address" placeholder="Straße, Ort"></div><div class="field full"><label>Notiz (optional)</label><input name="note" placeholder="Öffnungszeiten, Ausstattung"></div><div class="full"><button>Trainingsort speichern</button></div></form></div><div class="panel"><h2>Gespeicherte Orte</h2>${db.locations.map(l=>item(esc(l.name),`${esc(l.address||'')}${l.note?' · '+esc(l.note):''}`,delBtn('location',l.id))).join('')||empty('Speichere hier deine Trainingsorte.')}</div>`
};
function wireCommon(root){
root.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{let type=b.dataset.del,idv=b.dataset.id;let map={exercise:'exercises',workout:'workouts',plan:'plans',history:'history',pr:'prs',measurement:'measurements',photo:'photos',food:'foods',location:'locations'};if(b.dataset.arm!=='1'){b.dataset.label=b.textContent;b.dataset.arm='1';b.textContent='Sicher?';setTimeout(()=>{b.dataset.arm='';b.textContent=b.dataset.label},3000);return}db[map[type]]=db[map[type]].filter(x=>x.id!==idv);if(type==='plan'&&db.activePlan===idv)db.activePlan=null;render()});
root.querySelectorAll('[data-activate]').forEach(b=>b.onclick=()=>{db.activePlan=b.dataset.activate;render();toast('Trainingsplan aktiviert')});
root.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>{let w=db.workouts.find(x=>x.id===b.dataset.start);if(!w)return;editHistory(null,{id:id(),name:w.name,date:'',iso:todayIso(),workoutId:w.id,exerciseIds:[...w.exerciseIds],sets:{},note:''})});
root.querySelectorAll('[data-editworkout]').forEach(b=>b.onclick=()=>editWorkout(b.dataset.editworkout));
root.querySelectorAll('[data-editplan]').forEach(b=>b.onclick=()=>editPlan(b.dataset.editplan));
root.querySelectorAll('[data-openhistory],[data-edit-history]').forEach(b=>b.onclick=()=>editHistory(b.dataset.openhistory||b.dataset.editHistory));
let nb=root.querySelector('#newHist');if(nb)nb.onclick=()=>{let w=db.workouts.find(x=>x.id===root.querySelector('#nhw').value);editHistory(null,{id:id(),name:w?w.name:'Freies Training',date:'',iso:root.querySelector('#nhd').value||todayIso(),workoutId:w?w.id:null,exerciseIds:w?[...w.exerciseIds]:[],sets:{},note:''})};
bindForm(root,'exerciseForm',d=>{db.exercises.push({id:id(),name:d.name.trim(),group:d.group,equipment:d.equipment,note:d.note});toast('Übung gespeichert')});
bindForm(root,'workoutForm',d=>{let sel=root.querySelector('[name=exerciseIds]');let exerciseIds=[...sel.selectedOptions].map(o=>o.value);db.workouts.push({id:id(),name:d.name.trim(),note:d.note,exerciseIds});toast('Workout-Vorlage gespeichert')});
bindForm(root,'planForm',d=>{let schedule={};[0,1,2,3,4,5,6].forEach(n=>schedule[n]=d['day'+n]||'');db.plans.push({id:id(),name:d.name.trim(),note:d.note,schedule});toast('Trainingsplan gespeichert')});
bindForm(root,'prForm',d=>{db.prs.push({...d,id:id()});toast('Bestleistung gespeichert')});
bindForm(root,'measureForm',d=>{db.measurements.push({...d,id:id()});toast('Messwerte gespeichert')});
bindForm(root,'locationForm',d=>{db.locations.push({...d,id:id()});toast('Trainingsort gespeichert')});
bindForm(root,'foodForm',d=>{if(!d.name?.trim())return;db.foods.push({...d,id:id()});toast('Lebensmittel hinzugefügt')});
let pf=root.querySelector('#photoForm');if(pf)pf.onsubmit=async ev=>{ev.preventDefault();let f=pf.image.files[0];if(!f)return;try{let data=await compressImage(f);db.photos.push({id:id(),date:pf.date.value,note:pf.note.value,data});save();render();toast('Foto gespeichert')}catch(e){toast('Foto konnte nicht gespeichert werden: Speicher eventuell voll')}}};
function bindForm(root,idv,fn){let f=root.querySelector('#'+idv);if(f)f.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f).entries());fn(d);save();render()}}
function compressImage(file){return new Promise((resolve,reject)=>{let r=new FileReader();r.onerror=reject;r.onload=()=>{let im=new Image();im.onerror=reject;im.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,1200/Math.max(im.width,im.height));c.width=im.width*scale;c.height=im.height*scale;c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.78))};im.src=r.result};r.readAsDataURL(file)})}
function modal(title,body,onSave){const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:#0008;z-index:20;display:grid;place-items:center;padding:14px;overflow:auto';o.innerHTML='<div class="panel" style="max-width:520px;width:100%;margin:0"><h2>'+title+'</h2><form class="stack">'+body+'<div class="row"><button>Speichern</button><button type="button" class="ghost" data-x>Abbrechen</button></div></form></div>';document.body.append(o);o.querySelector('[data-x]').onclick=()=>o.remove();o.querySelector('form').onsubmit=e=>{e.preventDefault();if(onSave(new FormData(e.target),e.target)===false)return;o.remove();save();render()}}
const exOpts=sel=>db.exercises.map(e=>`<option value="${e.id}" ${sel.includes(e.id)?'selected':''}>${esc(e.name)}</option>`).join('');
const exSel=sel=>`<div class="field"><label>Übungen (Mehrfachauswahl)</label><select name="ex" multiple size="6" style="min-height:140px">${exOpts(sel)}</select></div>`;
function editWorkout(wid){let w=db.workouts.find(x=>x.id===wid);if(!w)return;modal('Vorlage bearbeiten',`<div class="field"><label>Name</label><input name="name" required value="${esc(w.name)}"></div>`+exSel(w.exerciseIds),(fd,f)=>{w.name=(fd.get('name')||'').trim()||w.name;w.exerciseIds=[...f.elements.ex.selectedOptions].map(o=>o.value);toast('Vorlage aktualisiert')})}
function editPlan(pid){let p=db.plans.find(x=>x.id===pid);if(!p)return;const D=[['Montag',1],['Dienstag',2],['Mittwoch',3],['Donnerstag',4],['Freitag',5],['Samstag',6],['Sonntag',0]];modal('Plan bearbeiten',`<div class="field"><label>Planname</label><input name="name" required value="${esc(p.name)}"></div><div class="field"><label>Beschreibung</label><input name="note" value="${esc(p.note||'')}"></div>`+D.map(([d,n])=>`<div class="row"><div style="width:100px">${d}</div><select name="day${n}"><option value="">Ruhetag</option>${db.workouts.map(w=>`<option value="${w.id}" ${p.schedule[n]===w.id?'selected':''}>${esc(w.name)}</option>`).join('')}</select></div>`).join(''),fd=>{p.name=(fd.get('name')||'').trim()||p.name;p.note=fd.get('note')||'';D.forEach(([d,n])=>p.schedule[n]=fd.get('day'+n)||'');toast('Trainingsplan aktualisiert')})}
const todayIso=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const hIso=h=>h.iso||String(h.date||'').split('.').reverse().map(x=>x.padStart(2,'0')).join('-');
const histSorted=()=>db.history.slice().sort((a,b)=>hIso(b).localeCompare(hIso(a)));
const setTxt=(h,x)=>((h.sets||{})[x]||[]).map(t=>`${t.w??'–'}×${t.r??'–'}`).join(', ');
const lastTxt=(x,skip)=>{const h=histSorted().find(h=>h.id!==skip&&((h.sets||{})[x]||[]).length);return h?setTxt(h,x):''};
const setRow=t=>`<div class="row" data-set><input class="sw" type="number" inputmode="decimal" min="0" step=".25" placeholder="kg" value="${t?.w??''}"><input class="sr" type="number" inputmode="numeric" min="0" step="1" placeholder="Wdh" value="${t?.r??''}"><button type="button" class="ghost" data-rm style="flex:0 0 auto">✕</button></div>`;
const exBlock=(x,h)=>`<div class="item" style="display:block" data-ex="${x}"><div class="row between"><b>${esc(exerciseName(x))}</b><button type="button" class="ghost" data-rmex style="flex:0 0 auto">Entfernen</button></div><div class="muted small">Zuletzt: ${esc(lastTxt(x,h.id)||'–')}</div><div class="sets">${(((h.sets||{})[x]&&h.sets[x].length)?h.sets[x]:[{}]).map(setRow).join('')}</div><button type="button" class="secondary" data-add style="margin-top:6px">+ Satz</button></div>`;
const html=s=>{const d=document.createElement('div');d.innerHTML=s;return d.firstElementChild};
function editHistory(hid,draft){const h=draft||db.history.find(x=>x.id===hid);if(!h)return;
modal(draft?'Training eintragen':'Training bearbeiten',`<div class="field"><label>Name</label><input name="name" required value="${esc(h.name)}"></div><div class="field"><label>Datum</label><input type="date" name="iso" required value="${hIso(h)}"></div><div class="field"><label>Notiz</label><input name="note" value="${esc(h.note||'')}"></div><div id="exBlocks">${h.exerciseIds.map(x=>exBlock(x,h)).join('')}</div><div class="row"><select id="addExSel">${db.exercises.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select><button type="button" class="secondary" id="addExBtn" style="flex:0 0 auto">+ Übung</button></div>`,(fd,f)=>{const ids=[],sets={};
for(const b of f.querySelectorAll('[data-ex]')){const x=b.dataset.ex,arr=[];for(const r of b.querySelectorAll('[data-set]')){const w=r.querySelector('.sw').value,rp=r.querySelector('.sr').value;if(w===''&&rp==='')continue;const W=w===''?null:parseFloat(w),R=rp===''?null:parseInt(rp,10);if((W!==null&&!(W>=0&&W<=1000))||(R!==null&&!(R>=0&&R<=500))){toast('Bitte gültige Werte eintragen (Gewicht und Wiederholungen ≥ 0).');return false}arr.push({w:W,r:R})}ids.push(x);sets[x]=arr}
h.name=(fd.get('name')||'').trim()||h.name;h.iso=fd.get('iso');h.date=new Date(h.iso+'T12:00').toLocaleDateString('de-DE');h.note=fd.get('note')||'';h.exerciseIds=ids;h.sets=sets;if(draft)db.history.push(h);toast('Training gespeichert')});
const o=document.body.lastElementChild;
o.addEventListener('click',ev=>{const t=ev.target;
if(t.matches('[data-add]')){const box=t.closest('[data-ex]'),rows=box.querySelectorAll('[data-set]'),l=rows[rows.length-1];box.querySelector('.sets').append(html(setRow({w:l?l.querySelector('.sw').value:'',r:l?l.querySelector('.sr').value:''})))}
else if(t.matches('[data-rm]'))t.closest('[data-set]').remove();
else if(t.matches('[data-rmex]'))t.closest('[data-ex]').remove();
else if(t.id==='addExBtn'){const x=o.querySelector('#addExSel').value;if(!x){toast('Lege zuerst Übungen an.');return}if(o.querySelector('[data-ex="'+x+'"]')){toast('Übung ist schon dabei.');return}o.querySelector('#exBlocks').append(html(exBlock(x,h)))}})}


document.querySelector('#themeBtn').onclick=()=>{db.theme=db.theme==='dark'?'light':'dark';render()};
document.querySelector('#exportBtn').onclick=async()=>{const j=JSON.stringify(db,null,2),fn='form-fitness-backup-'+new Date().toISOString().slice(0,10)+'.json';try{const d=await claude.use('downloads');if(!d)throw 0;await d.save({filename:fn,data:j})}catch(e){if(e&&e.code==='declined')return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download=fn;a.click()}};
document.querySelector('#importBtn').onclick=()=>document.querySelector('#importFile').click();
document.querySelector('#importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());db=normalize(d);render();toast('Backup importiert')}catch{toast('Datei ist kein gültiges FORM / FITNESS-Backup')}};
document.addEventListener('click',async e=>{if(e.target.id==='foodSearch'){let name=document.querySelector('#foodForm [name=name]').value.trim();if(!name){toast('Bitte zuerst einen Lebensmittelnamen eingeben');return}try{let r=await fetch('https://world.openfoodfacts.org/cgi/search.pl?search_terms='+encodeURIComponent(name)+'&search_simple=1&action=process&json=1&page_size=8');let j=await r.json();let list=(j.products||[]).filter(p=>p.product_name);if(!list.length){toast('Keine passenden Produkte gefunden');return}let choice=prompt('Produktnummer wählen:\n'+list.map((p,i)=>`${i+1}. ${p.product_name} (${p.brands||'Marke unbekannt'})`).join('\n'));let p=list[parseInt(choice,10)-1];if(!p)return;let n=document.querySelector('#foodForm');n.name.value=p.product_name;n.kcal.value=p.nutriments?.['energy-kcal_100g']||0;n.protein.value=p.nutriments?.proteins_100g||0;n.carbs.value=p.nutriments?.carbohydrates_100g||0;n.fat.value=p.nutriments?.fat_100g||0;n.barcode.value=p.code||'';toast('Produktdaten übernommen – bitte prüfen')}catch{toast('Online-Suche fehlgeschlagen. Verbindung prüfen')}}if(e.target.id==='scanBtn'){let code=prompt('Barcode/EAN eingeben');if(!code)return;document.querySelector('#foodForm [name=barcode]').value=code;try{let r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json');let j=await r.json(),p=j.product;if(!p){toast('Barcode nicht gefunden');return}let n=document.querySelector('#foodForm');n.name.value=p.product_name||'';n.kcal.value=p.nutriments?.['energy-kcal_100g']||0;n.protein.value=p.nutriments?.proteins_100g||0;n.carbs.value=p.nutriments?.carbohydrates_100g||0;n.fat.value=p.nutriments?.fat_100g||0;toast('Produktdaten übernommen – bitte prüfen')}catch{toast('Barcode-Suche fehlgeschlagen')}}});
save();render();
</script></body></html>
